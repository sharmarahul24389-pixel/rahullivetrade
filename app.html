<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeBot Pro - Live Trading Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .info-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .tab {
            padding: 12px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .assets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .asset-card {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 20px;
            background: #f9f9f9;
            transition: all 0.3s;
        }

        .asset-card:hover {
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transform: translateY(-5px);
        }

        .asset-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .symbol {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .price {
            font-size: 20px;
            color: #667eea;
            font-weight: bold;
        }

        .change {
            font-size: 14px;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
        }

        .change.positive {
            background: #d4edda;
            color: #155724;
        }

        .change.negative {
            background: #f8d7da;
            color: #721c24;
        }

        .signal {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .signal.buy {
            background: #d4edda;
            color: #155724;
        }

        .signal.sell {
            background: #f8d7da;
            color: #721c24;
        }

        .signal.wait {
            background: #fff3cd;
            color: #856404;
        }

        .trade-details {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .trade-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .trade-row:last-child {
            border-bottom: none;
        }

        .trade-label {
            color: #666;
        }

        .trade-value {
            font-weight: bold;
            color: #333;
        }

        .execute-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .execute-btn:hover {
            background: #5568d3;
            transform: scale(1.02);
        }

        .pnl-tracker {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .pnl-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 18px;
        }

        .pnl-value {
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: rgba(255,255,255,0.3);
            border-radius: 15px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            height: 100%;
            background: #4CAF50;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>

        function calculateTrade(price, signal) {
            const accountSize = 100000;
            const dailyTarget = 450;
            const maxLoss = 125;

            if (signal === 'BUY') {
                const stopLoss = price * 0.98;
                const riskPerShare = price - stopLoss;
                const shares = Math.floor(maxLoss / riskPerShare);
                const targetPrice = price + (riskPerShare * 2.5);
                const potentialGain = (targetPrice - price) * shares;

                return {
                    action: 'BUY',
                    entryPrice: price.toFixed(2),
                    stopLoss: stopLoss.toFixed(2),
                    targetPrice: targetPrice.toFixed(2),
                    shares: shares,
                    riskAmount: maxLoss,
                    potentialGain: potentialGain.toFixed(2),
                    riskReward: '1:2.5'
                };
            } else if (signal === 'SELL') {
                const stopLoss = price * 1.02;
                const riskPerShare = stopLoss - price;
                const shares = Math.floor(maxLoss / riskPerShare);
                const targetPrice = price - (riskPerShare * 2.5);
                const potentialGain = (price - targetPrice) * shares;

                return {
                    action: 'SHORT',
                    entryPrice: price.toFixed(2),
                    stopLoss: stopLoss.toFixed(2),
                    targetPrice: targetPrice.toFixed(2),
                    shares: shares,
                    riskAmount: maxLoss,
                    potentialGain: potentialGain.toFixed(2),
                    riskReward: '1:2.5'
                };
            }
            return null;
        }
